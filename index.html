/* ---------- Live connection ---------- */
// Live link to the office. The Mac can quietly drop long connections (sleep, App Nap),
// and WebKit doesn't always retry, so keep an eye on it and reconnect ourselves.
let es = null, lastHeard = 0, sawPing = false, pageBuild = null;
function reloadWhenSafe() {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '') && document.activeElement.value;
  if (!typing && !hire) return location.reload();
  setTimeout(reloadWhenSafe, 5000);
}
function reconnect() { try { es?.close(); } catch (e) {} connected = false; render(); connect(); }
function linkLooksDead() { return !connected || es?.readyState === 2 || (sawPing && Date.now() - lastHeard > 50000); }
setInterval(() => { if (ONLINE && !SHOTTING && linkLooksDead()) reconnect(); }, 10000);
for (const evName of ['focus', 'online', 'pageshow']) window.addEventListener(evName, () => { if (ONLINE && linkLooksDead()) reconnect(); });
document.addEventListener('visibilitychange', () => { if (ONLINE && !document.hidden && linkLooksDead()) reconnect(); });

function connect() {
  es = new EventSource(`/api/events?token=${TOKEN}`);
  es.onopen = () => { connected = true; lastHeard = Date.now(); render(); };
  es.onerror = () => { connected = false; render(); if (es.readyState === 2) setTimeout(reconnect, 2000); };
  es.onmessage = e => {
    lastHeard = Date.now();
    const ev = JSON.parse(e.data);
    if (ev.type === 'ping') { sawPing = true; return; }
    if (ev.type === 'hello') {
      if (awaitingUpdate) return location.reload();
      // The office was updated: load the new page once nothing is being typed.
      if (pageBuild && ev.build && ev.build !== pageBuild) reloadWhenSafe();
      pageBuild ||= ev.build;
      office = ev.office;
      guardLog = ev.guardLog || [];
      if (ev.moods) moods = new Set(ev.moods);
      applyTheme();
      fetchUsage();
      busy = new Set(ev.busy);
      perms = new Map(ev.permissions.map(r => [r.reqId, r]));
      for (const id of ev.login?.ids || []) signIn.ids.add(id);
      if (ev.login?.needed && !signIn.state) signIn.state = 'needs';
      render(); renderDrawer(true); renderHire();
      if (drawer.id && drawer.tab === 'chat') { const p = find(drawer.id); if (p) loadChat(p); }
      applyShot();
      maybeTour();
      if (!SHOTTING) recheckAfterRestart();
    } else if (ev.type === 'needsLogin') {
      signInNeeded(ev.id);
    } else if (ev.type === 'loginOk') {
      if (signIn.state && signIn.state !== 'ok') { signIn.state = signIn.ids.size ? 'ok' : null; renderSignIn(); }
    } else if (ev.type === 'project') {
      const i = office.projects.findIndex(p => p.id === ev.project.id);
      const prevSession = i >= 0 ? office.projects[i].sessionId : undefined;
      if (i >= 0 && office.projects[i].wrapping && !ev.project.wrapping && ev.project.day > office.projects[i].day) {
        toast(`${workerOf(ev.project).name} wrapped up Shift ${ev.project.day - 1}. The summary is in Past Shifts.`);
      }
      if (i >= 0) {
        const f = document.activeElement?.dataset?.field;
        if (f && drawer.id === ev.project.id) ev.project[f] = office.projects[i][f];
        office.projects[i] = ev.project;
      } else office.projects.push(ev.project);
      if (drawer.id === ev.project.id) {
        if (ev.project.unread && drawer.tab === 'chat') patch(ev.project, { unread: false });
        const switched = prevSession && ev.project.sessionId !== prevSession;
        if (drawer.tab === 'chat' && switched && !ev.project.closed) loadChat(ev.project);
        renderDrawer(false);
      }
      render(); if (hire) renderHire();
    } else if (ev.type === 'worker') {
      const i = office.workers.findIndex(w => w.id === ev.worker.id);
      if (i >= 0) office.workers[i] = ev.worker; else office.workers.push(ev.worker);
      render();
      if (drawer.id) renderDrawer(false);
    } else if (ev.type === 'deleted') {
      office.projects = office.projects.filter(p => p.id !== ev.id);
      if (drawer.id === ev.id) closeDrawer(); else render();
    } else if (ev.type === 'guard') {
      guardLog = ev.log || [];
      if (view === 'settings') render();
    } else if (ev.type === 'toast') {
      toast(ev.text);
    } else if (ev.type === 'settings') {
      office.settings = ev.settings;
      applyTheme();
      render(); if (!hire) renderHire();  // closes the welcome screen in other windows too
    } else if (ev.type === 'stickies') {
      office.stickies = ev.stickies;
      if (!document.activeElement?.dataset?.sticky) render();
    } else if (ev.type === 'whiteboard') {
      office.whiteboard = ev.text;
      if (document.activeElement?.id !== 'wb') render();
    } else if (ev.type === 'chat') {
      const tool = ev.items.findLast(x => x.kind === 'tool');
      if (tool) {
        const p = find(ev.id), before = p && moodOf(p, askingCount(p.id));
        lastTool.set(ev.id, tool.name);
        if (p && moodOf(p, askingCount(p.id)) !== before) render();
      }
      if (chat && chat.id === ev.id) {
        if (chat.loading) chat.buffer.push(...ev.items); else chat.items.push(...ev.items);

      }
    } else if (ev.type === 'busy') {

      ev.busy ? busy.add(ev.id) : busy.delete(ev.id);
      if (!was) lastTool.delete(ev.id);  // a fresh turn starts focused
      if (was && !ev.busy) notify(ev.id, 'has something for you');
      const waited = !ev.busy && chromeWait.delete(ev.id);  // the step finished, so the Chrome change is in
      render();
      if (drawer.id === ev.id) renderDrawer(waited && drawer.tab === 'details');
    } else if (ev.type === 'permission') {

      if (window.webkit?.messageHandlers?.office) {

        const i = ev.req.input || {};
        window.webkit.messageHandlers.office.postMessage({ kind: 'ask', reqId: ev.req.reqId, projectId: ev.req.projectId, canAlways: !!ev.req.canAlways,
          title: `${aw.name} · ${askQuestion(ev.req, ap)}`,
          body: [i.description || ev.req.description || '', i.command || (i.file_path ? shortPath(i.file_path, ap?.folder) : '')].filter(Boolean).join('\n').slice(0, 300) });
      } else notify(ev.req.projectId, 'is asking "May I?"', ev.req.title);

function notify(id, what, detail) {

}

async function sendMsg(p) {
  const box = $('#msg');
  const text = box.value.trim();
  const drafts = photoDrafts[p.id] || [];
  if (drafts.some(x => x.loading)) return toast('Still adding your photos. One moment.');
  if (!text && !drafts.length) return;
  // /login can't work inside a critter's chat: run the office's own sign-in instead.
  if (/^\/login\s*$/i.test(text) && !drafts.length) {
    box.value = ''; autosize(box); closeSlash();
    signIn.ids.add(p.id);
    return startSignIn();
  }
  if (p.inDesktop && !p.desktopDone && !confirm(`This chat is still open in the Claude desktop app.\n\nSend from the office instead? Only type in one place at a time.`)) return;
  if (signIn.state === 'ok' && signIn.ids.has(p.id)) signInDone(p.id);
  box.value = ''; autosize(box);
  photoDrafts[p.id] = []; renderPhotoTray(p);
  const photos = drafts.map(({ kind, name, type, data, view, viewType, full, fullType }) => ({ kind, name, type, data, view, viewType, full, fullType }));
  const plan = !!planNext[p.id] && !text.startsWith('/');
  closeSlash();
  try {
    await api('POST', `/api/projects/${p.id}/message`, { text, photos, plan });
    if (plan) { planNext[p.id] = false; renderComposer(p); }
  }
  catch (e) { box.value = text; photoDrafts[p.id] = drafts; renderPhotoTray(p); }
}

      const data = JSON.parse(localStorage.getItem('agentOffice.v1'));
      await api('POST', '/api/import', { office: data });
      try { localStorage.setItem('agentOffice.v1.imported', localStorage.getItem('agentOffice.v1')); localStorage.removeItem('agentOffice.v1'); } catch (e) {}
      return toast('Cubicles moved in. Pick a folder for each one to start chatting.');
    }
    case 'enable-alerts': return Notification.requestPermission().then(render);
    case 'test-alert': window.webkit?.messageHandlers?.office?.postMessage({ kind: 'test-alert' }); return toast('Test alert sent. Switch to another app to see it in a few seconds.');
    default: return;
  }
  render();
  if (drawer.id) renderDrawer(false);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'msg') return autosize(el);
  if (el.id === 'h-name' && $('#h-newpath')) { $('#h-newpath').textContent = newFolderPreview(el.value); return; }
  if (el.dataset.sticky) {
    const n = office.stickies.find(x => x.id === el.dataset.sticky);
    if (n) { n.text = el.value; saveStickies(); }
    return;
  }
  if (el.dataset.worker) {
    const w = findWorker(el.dataset.worker);
    if (w) renameWorker(w, el.value);
    return;
  }
  const f = el.dataset.field;
  if (f && drawer.id) {
    patch(find(drawer.id), { [f]: el.value }, { wait: 500 });
    $('#app').innerHTML = view === 'boss' ? renderBoss() : view === 'meadow' ? renderMeadow() : view === 'settings' ? renderSettings() : view === 'search' ? renderSearch() : renderFloor();
  } else if (el.id === 'wb') {
    office.whiteboard = el.value;
    clearTimeout(patchTimers.wb);
    patchTimers.wb = setTimeout(() => api('PUT', '/api/whiteboard', { text: el.value }).catch(() => {}), 500);
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  const p = drawer.id && find(drawer.id);
  if (el.id === 'floor-sort') {
    floorSort = el.value;
    try { localStorage.setItem('agentOffice.floorSort', floorSort); } catch (err) {}
    return render();
  }
  if (el.id === 'f-folder' && p) {
    const folder = el.value.trim();
    if (folder === p.folder) return;
    api('PATCH', `/api/projects/${p.id}`, { folder }).then(() => {
      p.folder = folder; p.sessionId = null; chat = null; sessionsList = null;
      renderDrawer(true);
      toast('Folder set. The next message starts a fresh chat there.');
    }).catch(() => { el.value = p.folder; });
  } else if (el.id === 's-trusted') {
    const was = (office.settings?.trustedSites || []).join('\n');
    api('PUT', '/api/settings', { trustedSites: el.value }).then(r => {
      office.settings = r.settings;
      const now = (r.settings.trustedSites || []).join('\n');
      el.value = now;
      if (now !== was) toast(`Saved ${r.settings.trustedSites.length} trusted site${r.settings.trustedSites.length === 1 ? '' : 's'}. Free critters can reach them from their next message.`);
    }).catch(() => {});  // keep what they typed so they can fix the line the toast names
  } else if (el.dataset.setting) {
    const k = el.dataset.setting, v = el.value.trim(), was = office.settings?.[k] || '';
    if (v === was) return;
    api('PUT', '/api/settings', { [k]: v }).then(r => {
      office.settings = r.settings;
      if (k === 'name' && $('#s-name-hint')) $('#s-name-hint').innerHTML = nameHint();
      toast(k === 'name' ? (v ? `Hi, ${ownerName()}! Critters will call you that from their next shift.` : 'Critters will call you the Boss.') : `New projects will go in ${projectsRoot()}.`);
    }).catch(() => { el.value = was; });
  } else if (el.dataset.voice) {
    const vw = findWorker(el.dataset.voice);
    if (vw) {
      vw.personality = el.value;
      api('PATCH', `/api/workers/${vw.id}`, { personality: el.value }).then(() =>
        toast(`${vw.name}: ${VOICES.find(v => v[0] === el.value)[1]}, from their next message.`)).catch(() => {});
    }
  } else if (el.dataset.freedom) {
    const fp = find(el.dataset.freedom);
    if (fp) { patch(fp, { permissionMode: el.value }); toast(`${workerOf(fp).name}: ${approvalName(el.value)}.`); }
  } else if (el.dataset.effort) {
    const ep = find(el.dataset.effort);
    if (ep) { patch(ep, { effort: el.value }); toast(`${workerOf(ep).name}: ${EFFORTS.find(x => x[0] === el.value)[1]} effort.`); }
  } else if (el.dataset.model) {
    const mp = find(el.dataset.model);
    if (mp) { patch(mp, { model: el.value }); toast(`${workerOf(mp).name} will use ${modelName(el.value)} from their next message.`); }
  } else if (el.id === 'f-chrome-free' && p) {
    patch(p, { chromeFree: el.checked });
  } else if (el.id === 'f-chrome' && p) {
    setChrome(p, el);
  } else if (el.dataset.worker) {
    render();
  }
});

// Photos: the picker, pasting into the message box, or dropping onto the cubicle drawer.
document.addEventListener('change', e => {
  if (e.target.id !== 'photoIn') return;
  addPhotos(find(drawer.id), e.target.files);
  e.target.value = '';
});
document.addEventListener('paste', e => {
  if (e.target.id !== 'msg') return;
  const files = [...(e.clipboardData?.files || [])];
  if (!files.length) return;
  e.preventDefault();
  addPhotos(find(drawer.id), files);
});
// A photo dropped anywhere else shouldn't make the page open the file instead.
for (const t of ['dragover', 'drop']) document.addEventListener(t, e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
const drawerEl = document.getElementById('drawer');
const canDrop = e => drawer.id && find(drawer.id)?.folder && !find(drawer.id)?.closed && [...(e.dataTransfer?.types || [])].includes('Files');
drawerEl.addEventListener('dragover', e => { if (!canDrop(e)) return; e.preventDefault(); drawerEl.classList.add('dropping'); });
drawerEl.addEventListener('dragleave', e => { if (!drawerEl.contains(e.relatedTarget)) drawerEl.classList.remove('dropping'); });
drawerEl.addEventListener('drop', e => {
  drawerEl.classList.remove('dropping');
  if (!canDrop(e)) return;
  e.preventDefault();
  if (drawer.tab !== 'chat') openDrawer(drawer.id, 'chat');
  addPhotos(find(drawer.id), e.dataTransfer.files);
});

document.addEventListener('keydown', e => {
  if (tour) {
    if (e.key === 'Escape') { e.preventDefault(); return endTour(false); }
    if (e.key === 'ArrowRight') { e.preventDefault(); return tourStep(1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); return tourStep(-1); }
    if (e.key === 'Tab') {  // keep focus inside the tour card
      const b = [...document.querySelectorAll('#tour button')], i = b.indexOf(document.activeElement);
      e.preventDefault();
      return b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length]?.focus();
    }
    if (!['Enter', ' '].includes(e.key)) e.preventDefault();
    return;
  }
  if (e.target.id === 'msg' && slash.open && slash.items.length && ['ArrowDown', 'ArrowUp', 'Tab', 'Enter', 'Escape'].includes(e.key)) {
    e.preventDefault();
    if (e.key === 'Escape') return closeSlash();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { slash.sel = (slash.sel + (e.key === 'ArrowDown' ? 1 : -1) + slash.items.length) % slash.items.length; return updateSlash(); }
    return pickCommand(slash.items[slash.sel].name);
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (drawer.id) closeDrawer();
    go('search');
    return setTimeout(() => $('#searchQ')?.focus(), 0);
  }
  if (e.target.id === 'msg' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    const p = find(drawer.id);
    if (p) sendMsg(p);
  } else if (e.key === 'Escape') {
    if (choice) choice(null);
    else if (hire) { hire = null; renderHire(); }
    else if (drawer.id && !document.querySelector('#tray .ask:focus-within')) closeDrawer();
  } else if (e.key === 'Enter' && (e.target.id === 'setup-name' || e.target.id === 'setup-root')) {
    e.preventDefault();
    finishSetup();
  } else if (e.key === 'Enter' && hire && (e.target.id === 'h-name' || e.target.id === 'h-folder')) {
    e.preventDefault();
    document.querySelector('[data-action="hire-go"]')?.click();
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  if (form.dataset.form === 'save') {
    const sp = find(form.dataset.id), btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Saving…';
    const r = await api('POST', `/api/projects/${sp.id}/save`, { message: form.querySelector('input').value.trim() }).catch(() => null);
    if (r?.ok) toast('Saved a version.');
    return loadChanges(sp);
  }
  if (form.dataset.form === 'job') {
    const jp = find(form.dataset.id), text = form.querySelector('input.field').value.trim();
    if (!jp || !text) return;
    const job = { text, every: form.every.value, weekday: +form.weekday.value, time: form.time.value || '09:00', on: true };
    patch(jp, { jobs: [...(jp.jobs || []), job] });
    renderDrawer(true);
    return toast(`Job added: ${jobWhen(job)}.`);
  }
  const input = form.querySelector('input.field');
  const text = input.value.trim();
  const p = find(form.dataset.id);
  if (!text || !p) return;
  if (form.dataset.form === 'todo') {
    const owner = form.querySelector('input[type=radio]:checked')?.value || 'critter';
    patch(p, { todos: [...p.todos, { id: rid(), text, done: false, owner }] });
  }
  else patch(p, { ideas: [...p.ideas, { id: rid(), text }] });
  const where = form.closest('#drawer') ? '#drawer' : '#app';
  pendingFocus = `${where} form[data-form="${form.dataset.form}"][data-id="${p.id}"] input`;
  $('#app').innerHTML = '';
  render();
  if (drawer.id) renderDrawer(true);
});

$('#modal').addEventListener('click', e => {
  const c = e.target.closest('[data-choice]');
  if (c) return choice?.(c.dataset.choice);
  if (e.target.id === 'modal') { if (choice) return choice(null); hire = null; renderHire(); }
});

function exportData() {
  const blob = new Blob([JSON.stringify(office, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `burrow-and-co-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.projects)) throw new Error('No projects list in that file.');
    if (!confirm(`Replace the whole office with ${data.projects.length} project(s) from "${file.name}"?`)) return;
    await api('POST', '/api/import', { office: data });
    closeDrawer();
  } catch (err) { toast('Could not import that file: ' + err.message); }
});

render();
if (ONLINE) connect();
setInterval(() => { if (!drawer.id && !hire && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')) render(); }, 60000);
</script>
</body>
</html>
