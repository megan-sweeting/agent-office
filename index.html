<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burrow &amp; Co.</title>
<script>
  // Pick light or dark before the page paints, from the last-used setting.
  (function () {
    var t = 'system';
    try { t = localStorage.getItem('agentOffice.theme') || 'system'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F8F1DC;
    --card: #FFFCF2;
    --wall: #A6C07F;
    --moss: #587F3E;
    --moss-ink: #FFFCF2;
    --ink: #2A3825;
    --muted: #66705B;
    --line: #DDD0AE;
    --line-soft: #E9DFC4;
    --desk: #DDEBC4;
    --desk-edge: #BBD199;
    --link: #4E6B3A;
    /* Fox terracotta: the one warm accent, for anything that needs the boss's attention. */
    --accent: #BA5329; --accent-ink: #9A4222; --accent-bg: #FBE0D0; --accent-on: #FFFCF2;
    --ok-bg: #E0F0CF;   --ok: #2F5E2B;
    --warn-bg: var(--accent-bg); --warn: var(--accent-ink); --warn-line: var(--accent);
    /* Two supporting colours: berry (stuck, ideas) and mustard (to-dos, snack break, current stage). */
    --berry: #963A74;   --berry-ink: #7A2F5E;   --berry-bg: #F6DAEA;   --berry-on: #FFFCF2;
    --mustard: #E3A92E; --mustard-ink: #7A5600; --mustard-bg: #FDEFC6; --mustard-on: #33260A;
    --bad-bg: var(--berry-bg); --bad: var(--berry-ink); --bad-line: var(--berry);
    --del-bg: #F7DAD3;  --del: #8E3226;
    --off-bg: #E9E5D8;  --off: #545A4C;
    --sleep-bg: #E6E4F4; --sleep: #4B4880;
    --dusk-bg: #DCE9F5; --dusk: #3E6488;
    --trip-bg: #DCEFF1; --trip: #22606A;
    --team-bg: #E3E9F7; --team: #34508C;
    --nap-bg: var(--mustard-bg); --nap: var(--mustard-ink);
    --code: #F1EAD6;
    --bubble: #EBF1DC;
    --plate-moss: #587F3E; --plate-moss-on: #FFFCF2;
    --plate-berry: #963A74; --plate-berry-on: #FFFCF2;
    --plate-mustard: #E3A92E; --plate-mustard-on: #33260A;
    --plate-trip: #2E7A83; --plate-trip-on: #FFFCF2;
    --plate-team: #4A64A8; --plate-team-on: #FFFCF2;
    --plate-sleep: #6F66B0; --plate-sleep-on: #FFFCF2;
    --plate-rose: #B5566F; --plate-rose-on: #FFFCF2;
    --plate-sage: #A6C07F; --plate-sage-on: #22301C;
    --shadow: 0 10px 26px rgba(90, 70, 30, .14);
    --display: 'Fraunces', Georgia, serif;
    --body: 'Nunito', ui-rounded, system-ui, sans-serif;
  }
  :root { color-scheme: light; }
  /* Dark tokens. The page sets data-theme from Settings (Match my Mac / Light / Dark). */
  :root[data-theme="dark"] {
    color-scheme: dark;
      --paper: #172012;
      --card: #33422A;
      --wall: #5E7C45;
      --moss: #9CC57B;
      --moss-ink: #162010;
      --ink: #F2ECD8;
      --muted: #B0BAA0;
      --line: #48583C;
      --line-soft: #3C4A32;
      --desk: #445839;
      --desk-edge: #35452C;
      --link: #B4D899;
      --accent: #F29B72; --accent-ink: #F7B593; --accent-bg: #4A2B1C; --accent-on: #1B130E;
      --ok-bg: #27401F;   --ok: #B2E69F;
      --berry: #E298C8;   --berry-ink: #EDB3DC;   --berry-bg: #432440;   --berry-on: #1E1219;
      --mustard: #F2C35A; --mustard-ink: #F7D37E; --mustard-bg: #463716; --mustard-on: #231A06;
      --del-bg: #43231E;  --del: #F2A497;
      --off-bg: #333A2D;  --off: #C0C6B1;
      --sleep-bg: #2F2E47; --sleep: #C6C3EE;
      --dusk-bg: #1E3142; --dusk: #A8CBE8;
      --trip-bg: #1D3739; --trip: #9ED8DE;
      --team-bg: #25304A; --team: #B4C6F0;
      --code: #212A1C;
      --shadow: 0 10px 26px rgba(0, 0, 0, .35);
      --bubble: #3B4B30;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); min-height: 100vh; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--link); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  h1, h2, h3, .display { font-family: var(--display); }

  .btn {
    border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
    padding: 7px 16px; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; text-decoration: none;
  }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--moss); border-color: var(--moss); color: var(--moss-ink); }
  .btn.warn { border-color: var(--bad-line); color: var(--bad); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
  .btn.accent:hover { filter: brightness(1.06); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.small { padding: 4px 12px; font-size: 13px; }
  .btn.on { background: var(--moss); border-color: var(--moss); color: var(--moss-ink); }
  .icon { width: 18px; height: 18px; flex: none; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding: 18px 32px; border-bottom: 2px dashed var(--line); background: var(--paper);
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { margin: 0; font-size: 24px; line-height: 1.1; }
  .brand p { margin: 0; color: var(--muted); font-size: 14px; }
  .topbar nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .conn { font-size: 13px; color: var(--warn); font-weight: 700; }

  main { max-width: 1320px; margin: 0 auto; padding: 26px 32px 120px; }
  .banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; margin-bottom: 18px; border: 2px solid var(--warn-line); border-radius: 18px; background: var(--warn-bg); color: var(--warn); }
  .banner p { margin: 0; flex: 1; min-width: 200px; font-weight: 700; }

  /* Boss's burrow tile */
  .burrow {
    display: flex; align-items: center; gap: 18px; padding: 18px 24px; margin-bottom: 20px; text-decoration: none; color: var(--ink);
    background: var(--card); border: 3px solid var(--mustard); border-radius: 22px; cursor: pointer;
  }
  .burrow:hover { border-color: var(--accent); }
  .burrow h2 { margin: 0; font-size: 22px; }
  .burrow p { margin: 2px 0 0; color: var(--muted); }
  .burrow { padding: 12px 24px 12px 18px; }
  .burrow-door { display: grid; place-items: end center; width: 84px; height: 80px; background: var(--berry-bg); border-radius: 18px; padding-bottom: 4px; }
  .burrow-door svg { transform-origin: 50% 100%; }
  .burrow-text { flex: 1; min-width: 0; }
  .knock { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--accent-ink); white-space: nowrap;
    background: var(--accent-bg); border: 2px solid var(--accent); border-radius: 999px; padding: 8px 18px; display: inline-flex; gap: 6px; }
  .knock span { display: inline-block; }
  .knock .k1 { animation: knock 5s ease-in-out infinite; }
  .knock .k2 { animation: knock 5s ease-in-out .35s infinite; }
  .knock .arrow { transition: transform .2s ease; }
  .burrow:hover .knock .arrow { transform: translateX(4px); }
  .burrow:hover .burrow-door svg { animation: door-rattle .5s ease-in-out 2; }
  .burrow:hover .knock .k1, .burrow:hover .knock .k2 { animation-duration: 1.2s; }
  @keyframes knock { 0%, 12%, 100% { transform: none; } 4% { transform: translateY(-5px) rotate(-6deg); } 8% { transform: translateY(0) rotate(3deg); } }
  @keyframes door-rattle { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { .knock span, .burrow-door svg { animation: none !important; } }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .floor-bar { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .floor-bar .chips { margin: 0; flex: 1; }
  .floor-sort { display: flex; align-items: center; gap: 8px; margin-left: auto; font-weight: 700; font-size: 14px; color: var(--muted); }
  .floor-sort .field { width: auto; padding: 6px 36px 6px 12px; }
  .chip { padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; background: var(--c-bg); color: var(--c); }

  /* Cubicles */
  .floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 22px; }
  .cube {
    background: var(--card); border-radius: 26px 26px 18px 18px; border: 3px solid var(--wall); overflow: hidden;
    display: flex; flex-direction: column; cursor: pointer; transition: transform .12s ease; position: relative;
  }
  .cube:hover { transform: translateY(-2px); }
  .cube.asking, .cube.s-needs { border-color: var(--warn-line); box-shadow: 0 0 0 5px var(--warn-bg); }
  .cube .wall { background: var(--wall); height: 18px; display: flex; justify-content: center; }
  .plate {
    background: var(--plate, var(--moss)); color: var(--plate-on, var(--moss-ink)); font-weight: 800; font-size: 14px; padding: 3px 16px; border-radius: 0 0 12px 12px;
    height: 24px; max-width: 86%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cube.asking .plate, .cube.s-needs .plate { background: var(--accent); color: var(--accent-on); }
  .unread-dot { position: absolute; top: 26px; left: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card); }
  .scene { position: relative; height: 158px; margin-top: 10px; }
  .scene .critter { position: absolute; left: 50%; bottom: 0; width: 150px; height: 150px; margin-left: -75px; transition: transform .3s ease; }
  .busy .scene .critter { animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-4px); } }
  .s-out .scene .critter { opacity: .75; }
  .s-home .scene .critter { opacity: .4; filter: saturate(.6); }
  .desk { margin: 0 16px; height: 44px; background: var(--desk); border-bottom: 7px solid var(--desk-edge); border-radius: 12px; display: grid; place-items: center; }
  .desk-name { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
  .say {
    position: absolute; right: 12px; top: 4px; background: var(--card); border: 2px solid var(--wall); border-radius: 16px;
    padding: 4px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; --say-bg: var(--card); --say-line: var(--wall);
  }
  .say::first-letter { text-transform: uppercase; }
  /* speech bubble tail pointing down-left toward the critter */
  .say::before, .say::after { content: ''; position: absolute; left: 14px; width: 0; height: 0; border-style: solid; }
  .say::before { bottom: -11px; border-width: 11px 10px 0 0; border-color: var(--say-line) transparent transparent transparent; }
  .say::after { bottom: -7px; left: 16px; border-width: 8px 7px 0 0; border-color: var(--say-bg) transparent transparent transparent; }
  /* thought bubble: little trailing circles instead of a tail */
  .say.thought { border-radius: 999px; }
  .say.thought::before, .say.thought::after { border: 2px solid var(--say-line); background: var(--say-bg); border-radius: 50%; }
  .say.thought::before { width: 10px; height: 10px; bottom: -13px; left: 10px; }
  .say.thought::after { width: 6px; height: 6px; bottom: -21px; left: 2px; }
  .say.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); --say-bg: var(--warn-bg); --say-line: var(--warn-line); animation: bob 1.3s ease-in-out infinite; }
  .say.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); --say-bg: var(--bad-bg); --say-line: var(--bad-line); }
  .say.off { border-color: var(--line); color: var(--off); --say-line: var(--line); }
  .say.team { background: var(--team-bg); border-color: var(--team); color: var(--team); --say-bg: var(--team-bg); --say-line: var(--team); }
  .say.trip { background: var(--trip-bg); border-color: var(--trip); color: var(--trip); --say-bg: var(--trip-bg); --say-line: var(--trip); }
  .s-away .scene .critter { opacity: .3; filter: saturate(.5); }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .say, .scene .critter, .dots i { animation: none !important; } }
  .cube .info { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
  .cube .pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .scene .mate-pic { position: absolute; bottom: 0; width: 74px; height: 74px; }
  .scene .mate-pic.left { left: 10px; } .scene .mate-pic.right { right: 10px; }
  .scene .mate-pic.busy { animation: bounce 1.6s ease-in-out infinite; }
  .mates { display: flex; flex-direction: column; gap: 4px; border-top: 2px dashed var(--line-soft); padding-top: 8px; }
  .mate { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 2px 4px; border-radius: 10px; text-align: left; position: relative; }
  .mate:hover { background: var(--paper); }
  .mate img { width: 30px; height: 30px; flex: none; }
  .mate b { flex: 1; font-size: 14px; }
  .mate .pill { font-size: 12px; padding: 2px 9px; }
  .mate-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  .seat-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .seat-row button { display: flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px 3px 4px; font-weight: 800; font-size: 13px; }
  .seat-row button.on { border-color: var(--moss); background: var(--ok-bg); }
  .seat-row img { width: 26px; height: 26px; }
  .waiting { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; background: var(--paper); }
  .waiting h4 { margin: 0 0 6px; }
  .waiting ul { margin: 6px 0 10px; padding-left: 20px; font-size: 14px; }
  .pill.long-shift { --c: var(--mustard-ink); --c-bg: var(--mustard-bg); cursor: help; }
  .pill.running { --c: var(--off); --c-bg: var(--off-bg); font-weight: 700; max-width: 220px; overflow: hidden; text-overflow: ellipsis; cursor: help; }
  .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .who strong { font-family: var(--display); font-size: 19px; }
  .day { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .pill { align-self: flex-start; padding: 3px 11px; border-radius: 999px; font-weight: 800; font-size: 13px; background: var(--c-bg); color: var(--c); white-space: nowrap; }
  .stages { display: flex; gap: 6px; align-items: center; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--line-soft); border: 0; padding: 0; }
  .dot.on { background: var(--moss); }
  .dot.now { background: var(--mustard); box-shadow: 0 0 0 3px var(--mustard-bg); }
  .dot:hover { outline: 2px solid var(--muted); outline-offset: 2px; }
  .stages span { font-size: 13px; color: var(--muted); margin-left: 4px; }
  .task { margin: 0; font-size: 15px; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .task em { color: var(--muted); }
  .cube footer { display: flex; align-items: center; gap: 8px; border-top: 2px dotted var(--line); padding-top: 10px; font-size: 13px; color: var(--muted); }
  .cube footer .grow { flex: 1; }
  .badge { background: var(--mustard-bg); border-radius: 8px; padding: 2px 8px; color: var(--mustard-ink); font-weight: 800; }
  .vacant {
    border: 3px dashed var(--wall); border-radius: 26px 26px 18px 18px; min-height: 380px; background: transparent; color: var(--muted);
    display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 16px;
  }
  .vacant:hover { border-color: var(--accent); color: var(--accent-ink); }
  .vacant .peek { display: flex; justify-content: center; margin-bottom: 8px; }
  .vacant .peek img { width: 64px; height: 64px; margin: 0 -8px; }
  .empty { text-align: center; color: var(--muted); padding: 20px 0; }

  /* Gone home: a garden fence with a lit cottage, then the evening floor */
  .after-hours {
    margin-top: 34px; padding: 0 18px 22px; border-radius: 30px;
    background: linear-gradient(180deg, var(--dusk-bg), color-mix(in srgb, var(--dusk-bg) 35%, var(--paper)) 260px, var(--paper));
  }
  .home-time { display: flex; align-items: center; gap: 14px; padding: 18px 0 20px; }
  .fence {
    flex: 1; height: 24px; min-width: 20px; opacity: .8;
    background:
      linear-gradient(var(--dusk), var(--dusk)) 0 8px / 100% 3px no-repeat,
      linear-gradient(var(--dusk), var(--dusk)) 0 16px / 100% 3px no-repeat,
      repeating-linear-gradient(90deg, var(--dusk) 0 5px, transparent 5px 22px) 0 2px / 100% 22px no-repeat;
    -webkit-mask: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
            mask: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
  }
  .home-sign { display: flex; align-items: center; gap: 12px; max-width: 520px; color: var(--dusk); }
  .home-sign svg { flex: none; }
  .home-sign b { display: block; font-family: var(--display); font-size: 21px; line-height: 1.15; }
  .home-sign small { display: block; font-size: 14px; font-weight: 700; color: var(--muted); }
  .after-hours .cube { border-color: color-mix(in srgb, var(--wall) 55%, var(--dusk-bg)); }
  .after-hours .cube .wall { background: color-mix(in srgb, var(--wall) 55%, var(--dusk-bg)); }
  @media (max-width: 640px) { .after-hours { padding: 0 10px 16px; } .fence { min-width: 12px; } .home-sign small { font-size: 13px; } }

  .shelf { margin-top: 30px; }
  .shelf summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 18px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .shelf summary::-webkit-details-marker { display: none; }
  .shelf summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
  .shelf[open] summary::before { transform: rotate(90deg); }
  .closed-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
  .closed-list li { display: flex; align-items: center; gap: 12px; background: var(--card); border: 2px solid var(--line-soft); border-radius: 16px; padding: 8px 14px; flex-wrap: wrap; }
  .closed-list img { width: 42px; height: 42px; }
  .closed-list .what { flex: 1; min-width: 180px; }
  .closed-list .what b { display: block; }
  .closed-list .what span { color: var(--muted); font-size: 13px; }
  .quiet { margin-bottom: 18px; }
  .quiet > p { margin: 0 0 4px; }

  /* Meadow */
  .page-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h2 { margin: 0; font-size: 26px; }
  .page-head p { margin: 2px 0 0; color: var(--muted); }
  .meadow { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
  .critter-card { background: var(--card); border: 3px solid var(--wall); border-radius: 24px; padding: 14px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .critter-card.hired { border-color: var(--line-soft); }
  .critter-card img { width: 130px; height: 130px; }
  .critter-card .name { text-transform: uppercase; letter-spacing: .04em; font-family: var(--display); font-weight: 700; font-size: 20px; border: 2px solid transparent; background: transparent; text-align: center; width: 100%; border-radius: 10px; padding: 2px 6px; }
  .critter-card .name:hover, .critter-card .name:focus { border-color: var(--line); outline: none; }
  .critter-card .kind { color: var(--berry-ink); font-weight: 700; font-size: 13px; margin-top: -4px; }
  .critter-card .bio { font-size: 13px; font-style: italic; line-height: 1.35; }
  .critter-card .resume { font-size: 13px; color: var(--muted); min-height: 19px; }
  .critter-card > .btn { margin-top: auto; }

  /* Usage */
  .meter { display: inline-block; width: 120px; height: 10px; border-radius: 999px; background: var(--line-soft); overflow: hidden; vertical-align: middle; }
  .meter i { display: block; height: 100%; border-radius: 999px; background: var(--moss); }
  .meter.warm i { background: var(--mustard); }
  .meter.hot i { background: var(--accent); }
  .burrow-usage { margin-top: 6px !important; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .burrow-usage .meter { width: 90px; }
  .panel.usage { margin-bottom: 22px; border-color: var(--moss); }
  .usage-check { display: flex; align-items: center; gap: 10px; }
  .usage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .limits { display: grid; gap: 10px; margin: 12px 0 6px; }
  .limit { display: grid; grid-template-columns: 130px minmax(120px, 1fr) 48px auto; gap: 12px; align-items: center; }
  .limit .meter { width: 100%; height: 14px; }
  .limit .pct { font-weight: 800; text-align: right; }
  .usage-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
  .usage-table th, .usage-table td { text-align: left; padding: 8px 10px; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
  .usage-table thead th { font-size: 12px; color: var(--muted); font-weight: 800; }
  .who-cell { display: flex; align-items: center; gap: 10px; }
  .who-cell img { width: 38px; height: 38px; }
  .who-cell small { display: block; color: var(--muted); font-weight: 600; }
  .usage-split { display: flex; gap: 28px; align-items: center; margin: 16px 0 4px; flex-wrap: wrap; }
  .pie { width: 150px; height: 150px; border-radius: 50%; flex: none; position: relative; }
  .pie::after { content: ''; position: absolute; inset: 34px; border-radius: 50%; background: var(--card); }
  .pie-title { margin: 0 0 8px; font-size: 15px; }
  .pie-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .pie-legend li { display: flex; align-items: center; gap: 8px; }
  .pie-legend i { width: 12px; height: 12px; border-radius: 3px; }
  .pie-legend img { width: 28px; height: 28px; }
  .pie-legend span { margin-left: 6px; font-weight: 800; }
  .share { display: inline-block; width: 60px; height: 8px; border-radius: 999px; background: var(--line-soft); margin-right: 8px; overflow: hidden; vertical-align: middle; }
  .share i { display: block; height: 100%; background: var(--berry); border-radius: 999px; }
  @media (max-width: 640px) { .limit { grid-template-columns: 1fr auto; } .limit .meter { grid-column: 1 / -1; } }

  .guardrails { grid-column: 1 / -1; border-color: var(--berry); }
  .guard-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-top: 8px; }
  .guard-cols h4 { margin: 0 0 6px; font-size: 14px; }
  .guard-cols ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
  .guard-log { list-style: none; padding-left: 0 !important; }
  .guard-log small { display: block; color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; }
  @media (max-width: 900px) { .guard-cols { grid-template-columns: 1fr; } }
  /* Settings */
  .settings { display: grid; gap: 22px; grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr); align-items: start; }
  /* Two columns that stack on their own, so a tall box on one side doesn't leave gaps on the other. */
  .settings .set-col { display: grid; gap: 22px; min-width: 0; }
  .settings .guardrails { grid-column: 1 / -1; }
  .settings .you .label:first-of-type { margin-top: 0; }
  .settings .you p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; }
  .settings .alerts p { margin: 0 0 10px; font-size: 14px; line-height: 1.45; }
  @media (max-width: 900px) { .settings { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 3px solid var(--wall); border-radius: 22px; padding: 18px 22px; }
  .version p { margin: 6px 0 0; font-size: 14px; line-height: 1.45; }
  .version .ver-now code { font-weight: 700; }
  .version ul { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
  .version .ver-done { color: var(--ok); font-weight: 700; }
  .panel h3 { margin: 0 0 4px; font-size: 19px; }
  .panel > p { margin: 0 0 14px; color: var(--muted); }
  .themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  .themes button { border: 3px solid var(--line); border-radius: 18px; background: var(--paper); padding: 8px; font-weight: 800; font-size: 13px; white-space: nowrap; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .themes button.on { border-color: var(--accent); background: var(--accent-bg); }
  .swatch { height: 44px; border-radius: 12px; display: flex; gap: 4px; padding: 8px; align-items: flex-end; border: 1px solid rgba(0,0,0,.08); }
  .swatch i { width: 12px; height: 12px; border-radius: 50%; }
  .swatch.light { background: #F8F1DC; } .swatch.dark { background: #232E1C; }
  .swatch.system { background: linear-gradient(135deg, #F8F1DC 50%, #232E1C 50%); }
  .brains { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .brains li { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 2px solid var(--line-soft); border-radius: 16px; padding: 8px 14px; }
  .brains img { width: 46px; height: 46px; }
  .brains .what { flex: 1; min-width: 160px; }
  .brains .what b { display: block; }
  .brains .what span { color: var(--muted); font-size: 13px; display: block; }
  .brains .what .bio { color: var(--berry-ink); font-style: italic; margin-top: 2px; }
  .brains .pickers { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; min-width: 300px; }
  .brains select { width: 100%; }

  /* Hire modal */
  #modal { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(30, 36, 24, .45); padding: 16px; }
  #modal.open { display: grid; }
  .sheet { background: var(--card); border-radius: 26px; border: 3px solid var(--wall); width: min(760px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px 24px; box-shadow: var(--shadow); }
  .sheet h2 { margin: 0 0 4px; font-size: 24px; }
  .sheet .sub { margin: 0 0 16px; color: var(--muted); }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .pick button { background: var(--paper); border: 3px solid transparent; border-radius: 18px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; font-weight: 800; font-size: 14px; }
  .pick button img { width: 76px; height: 76px; }
  .pick button small { color: var(--muted); font-weight: 600; font-size: 12px; }
  .pick button.on { border-color: var(--accent); background: var(--accent-bg); }
  .sheet .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .sheet.setup { width: min(480px, 100%); text-align: center; }
  .sheet.setup img { width: 96px; height: 96px; }
  .sheet.setup .label, .sheet.setup .field, .sheet.setup .hint { text-align: left; }
  .sheet.setup .hint { margin: 6px 0 0; font-size: 13px; }
  .sheet.setup .actions { justify-content: center; }
  .sheet.pick-sheet { width: min(460px, 100%); }
  .wait-note { margin: 2px 0 0 28px; font-size: 13px; }

  /* First-time tour: the fox spotlights one part of the office at a time. */
  #tour { position: fixed; inset: 0; z-index: 35; --dim: rgba(30, 36, 24, .55); }
  :root[data-theme="dark"] #tour { --dim: rgba(0, 0, 0, .62); }
  #tour.no-spot { background: var(--dim); }
  .tour-spot { position: fixed; border-radius: 22px; pointer-events: none; box-shadow: 0 0 0 4px var(--accent), 0 0 0 9999px var(--dim); transition: top .25s ease, left .25s ease, width .25s ease, height .25s ease; }
  #tour.no-spot .tour-spot { display: none; }
  .tour-card { position: fixed; width: min(380px, calc(100vw - 32px)); background: var(--card); border: 3px solid var(--wall); border-radius: 22px; padding: 16px 18px 14px; box-shadow: var(--shadow); transition: top .25s ease, left .25s ease; }
  .tour-card .who { display: flex; gap: 12px; align-items: flex-start; }
  .tour-card img { width: 64px; height: 64px; flex: none; }
  .tour-card h2 { margin: 2px 0 4px; font-size: 19px; }
  .tour-card p { margin: 0; }
  .tour-card .foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .tour-card .steps { display: flex; gap: 5px; margin-right: auto; }
  .tour-card .steps i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .tour-card .steps i.on { background: var(--accent); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .tour-card.last .steps { width: 100%; margin-bottom: 2px; }
  .tour-card.last .foot { justify-content: flex-end; }
  .tour-mock { position: absolute; inset: 8px; background: var(--card); border: 2px solid var(--accent); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 6px; font-size: 13px; }
  .tour-mock b { font-size: 14px; }
  .tour-mock code { background: var(--code); border-radius: 6px; padding: 2px 6px; }
  .tour-mock span { display: flex; gap: 6px; }
  .tour-mock i { font-style: normal; }
  .tour-card .skip { background: none; border: 0; color: var(--muted); font-weight: 700; font-size: 13px; padding: 4px 6px; text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .tour-spot, .tour-card { transition: none; } }

  /* Forms */
  .field { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 9px 12px; background: var(--paper); }
  textarea.field { resize: vertical; min-height: 70px; }
  .field:focus { outline: none; border-color: var(--moss); }
  /* Our own arrow on dropdowns: the browser's sits tight against the rounded edge. */
  select.field { appearance: none; -webkit-appearance: none; padding-right: 38px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 21px) 50%, calc(100% - 16px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  /* Same breathing room for the arrow on folder suggestions and the clock on time boxes. */
  .field::-webkit-calendar-picker-indicator { margin-right: 6px; cursor: pointer; }
  .label { font-size: 13px; color: var(--muted); font-weight: 700; margin: 12px 0 4px; display: block; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .muted { color: var(--muted); font-size: 13px; }

  /* Drawer */
  #scrim { position: fixed; inset: 0; background: rgba(30, 36, 24, .35); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(1080px, 94vw); background: var(--card); border-left: 3px solid var(--wall);
    z-index: 11; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease;
  }
  body.drawer-open #scrim { opacity: 1; pointer-events: auto; }
  body.drawer-open #drawer { transform: none; }
  #dHead { padding: 14px 20px 0; }
  .d-top { display: flex; gap: 12px; align-items: center; }
  .d-top img { width: 64px; height: 64px; }
  .d-top .names { flex: 1; min-width: 0; }
  .d-top .names b { display: block; font-family: var(--display); font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-top .names span { color: var(--muted); font-size: 13px; }
  .x { border: 0; background: transparent; font-size: 22px; color: var(--muted); padding: 0 4px; align-self: flex-start; }
  .d-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  /* Practice café checklist */
  .practice { margin-top: 10px; padding: 10px 14px; border: 2px dashed var(--mustard); border-radius: 16px; background: var(--mustard-bg); }
  .practice-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .practice-top b { font-family: var(--display); font-size: 16px; }
  .practice-top .muted { margin-right: auto; }
  .practice ol { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; }
  .practice li { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); }
  .practice li i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; background: var(--line-soft); color: var(--ink); }
  .practice li.done { color: var(--ok); border-color: transparent; background: var(--ok-bg); }
  .practice li.done i { background: var(--ok); color: var(--card); }
  .practice li.now { color: var(--ink); border-color: var(--accent); }
  .practice li.now i { background: var(--accent); color: var(--accent-on); }
  .practice-hint { margin: 8px 0 0; font-size: 14px; font-weight: 700; color: var(--mustard-ink); }
  .signin-bar { margin-top: 10px; padding: 10px 14px; border: 2px solid var(--warn-line); border-radius: 14px; background: var(--warn-bg); color: var(--warn);
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: 14px; font-weight: 700; }
  .signin-bar p { margin: 0; flex: 1 1 240px; }
  .signin-bar p small { display: block; margin-top: 3px; font-weight: 600; }
  .signin-bar > span { flex: 1 1 100%; font-weight: 600; }
  .signin-bar.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .note-bar { margin-top: 10px; padding: 9px 14px; border-radius: 14px; font-size: 14px; background: var(--warn-bg); color: var(--warn); font-weight: 700; }
  .tabs { display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 2px dashed var(--line); overflow-x: auto; }
  .tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 12px 12px 0 0; color: var(--muted); font-weight: 800; white-space: nowrap; }
  .tab.on { background: var(--paper); color: var(--ink); }
  #dBody { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  #dFoot { border-top: 2px dashed var(--line); padding: 12px 20px 14px; }
  #dFoot:empty { display: none; }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; min-height: 46px; max-height: 200px; resize: none; border: 2px solid var(--line); border-radius: 22px; padding: 11px 16px; background: var(--paper); }
  .composer textarea:focus { outline: none; border-color: var(--moss); }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0 6px; }
  .ship { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .save-form { display: flex; gap: 8px; }
  .save-form .field { flex: 1; }
  .ship-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .ship-line .muted { flex: 1; min-width: 200px; }
  .jobs { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .jobs li { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--line-soft); border-radius: 12px; padding: 8px 10px; }
  .jobs li.off { opacity: .6; }
  .jobs li > div { flex: 1; }
  .jobs small { display: block; color: var(--muted); margin-top: 2px; }
  .jobs input[type=checkbox] { margin-top: 3px; width: 18px; height: 18px; }
  .job-form { display: flex; flex-direction: column; gap: 8px; }
  .job-when { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .job-when select, .job-when input { width: auto; }
  .search-box { font-size: 18px; padding: 14px 18px; border-radius: 999px; margin-bottom: 18px; }
  .results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .result { width: 100%; text-align: left; border: 2px solid var(--line); border-radius: 16px; background: var(--card); padding: 12px 16px; display: block; }
  .result:hover { border-color: var(--moss); }
  .r-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .r-top img { width: 34px; height: 34px; }
  .r-top b { font-family: var(--display); font-size: 17px; }
  .r-count { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--muted); }
  .result p { margin: 4px 0 0; font-size: 14px; line-height: 1.45; }
  .result small { font-weight: 800; color: var(--muted); }
  .result mark { background: var(--mustard-bg); color: inherit; border-radius: 3px; padding: 0 2px; }
  .plan-btn { flex: none; }
  .plan-btn.on { background: var(--team-bg); border-color: var(--team); color: var(--team); }
  .file-chip { display: flex; align-items: center; gap: 6px; height: 72px; max-width: 200px; padding: 0 28px 0 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 13px; font-weight: 700; margin: 0; position: relative; }
  .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip.sent { height: auto; padding: 8px 12px; border-radius: 14px; }
  .undo-btn { border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 2px 4px; opacity: 0; transition: opacity .15s; }
  .row.me:hover .undo-btn, .undo-btn:focus-visible { opacity: 1; }
  .undo-btn:hover { color: var(--accent-ink); text-decoration: underline; }
  @media (hover: none) { .undo-btn { opacity: .8; } }
  .plan-body { max-height: min(320px, 40vh); overflow: auto; padding: 10px 14px; margin: 0 14px; border: 2px solid var(--line-soft); border-radius: 12px; background: var(--paper); font-size: 14px; line-height: 1.45; }
  .plan-ask .ask-av span { background: var(--team); }
  .slash-menu { margin-bottom: 8px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); max-height: 260px; overflow: auto; }
  .slash-menu button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 12px; font-size: 14px; align-items: baseline; }
  .slash-menu button b { font-family: var(--mono, ui-monospace, monospace); white-space: nowrap; }
  .slash-menu button span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slash-menu button.on, .slash-menu button:hover { background: var(--ok-bg); }
  .slash-menu .empty { padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .photo-btn { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; flex: none; }
  .photo-tray { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .photo-tray:empty { display: none; }
  .photo-tray figure { position: relative; margin: 0; }
  .photo-tray img { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; border: 2px solid var(--line); display: block; }
  .photo-tray .rm { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--card); background: var(--ink); color: var(--card); font-size: 12px; line-height: 1; padding: 0; }
  .photo-tray .busy-photo { width: 72px; height: 72px; border-radius: 12px; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
  #drawer.dropping #dFoot { outline: 3px dashed var(--moss); outline-offset: -6px; border-radius: 14px; }
  .photos { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; }
  .photos img { max-width: 220px; max-height: 220px; border-radius: 16px; border: 2px solid var(--line-soft); display: block; object-fit: cover; }
  #drawer h3 { font-size: 16px; margin: 22px 0 8px; }
  #drawer h3:first-child { margin-top: 2px; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 800; }
  .choice.on { background: var(--moss); color: var(--moss-ink); border-color: var(--moss); }
  .radio { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
  .radio input { margin-top: 4px; accent-color: var(--moss); }
  .radio small { display: block; color: var(--muted); }
  .sessions { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .sessions li { display: flex; gap: 8px; align-items: center; border: 2px solid var(--line-soft); border-radius: 12px; padding: 6px 10px; font-size: 13px; }
  .sessions li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .worker-row { display: flex; align-items: center; gap: 12px; }
  .worker-row img { width: 56px; height: 56px; }
  .worker-row input { max-width: 220px; }
  .plates { flex-wrap: wrap; }
  .danger-zone { margin-top: 28px; padding-top: 16px; border-top: 2px dashed var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Chat */
  .chat { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 15px; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--moss); color: var(--moss-ink); border-bottom-right-radius: 5px; }
  .msg.me a { color: var(--moss-ink); }
  .msg.them { align-self: flex-start; background: var(--paper); border-bottom-left-radius: 5px; }
  .md { white-space: pre-wrap; }
  .md code { background: var(--code); padding: 1px 5px; border-radius: 5px; }
  .msg.me .md code { background: rgba(255,255,255,.2); }
  .md .h { display: inline-block; margin-top: 4px; }
  .md-table { overflow-x: auto; margin: 6px 0; white-space: normal; }
  .md table { border-collapse: collapse; font-size: 14px; line-height: 1.4; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--code); font-weight: 800; }

</style>

<body>
<header class="topbar">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="var(--moss)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 32c0-14 10-24 24-24 0 14-10 24-24 24z"></path><path d="M8 32 22 18"></path></svg>

<script>
const TOKEN = '__OFFICE_TOKEN__';
const ONLINE = !TOKEN.startsWith('__');
const STAGES = ['Planning', 'Building', 'Testing', 'Polish', 'Shipped'];
const STATUSES = {
  working: { label: 'Working',         chip: 'Working',          c: 'ok' },
  needs:   { label: 'Needs You',       chip: 'Need You',         c: 'warn' },
  blocked: { label: 'Stuck',           chip: 'Stuck',            c: 'bad' },
  break:   { label: 'Snack Break',     chip: 'On a Snack Break', c: 'nap' },

  home:    { label: 'Gone Home',       chip: 'Gone Home',        c: 'off' },
  away:    { label: 'On a Field Trip', chip: 'On a Field Trip',  c: 'trip' },
  crew:    { label: 'Leading a Team',  chip: 'Leading a Team',   c: 'team' },
};
const SAYS = {
  busy:    ['tap tap tap…', 'scribbling…', 'on a roll…', 'nibbling at it…'],
  working: ['scribbling…', 'on a roll…', 'thinking…'],
  needs:   ['psst, boss?', 'a quick question', 'boss? boss?', 'your turn!'],
  blocked: ['hmm, stuck', 'prickly problem', 'tangled up'],
  break:   ['snack break', 'stretching…', 'tea time'],
  out:     ['zzz', 'catnap', 'dozing…'],
  home:    ['gone home', 'see you tomorrow', 'home for the day'],
  away:    ['field trip!', 'back soon', 'off to the big studio'],
  crew:    ["the team's on it", 'checking on helpers', 'delegating…'],
};
const EDIT_TOOLS = ['Edit', 'Write', 'MultiEdit', 'NotebookEdit'];

let office = { projects: [], workers: [], whiteboard: '', settings: { theme: 'system' } };
const MODELS = [
  ['', 'Default (your Claude Code setting)'],
  ['claude-fable-5-1', 'Fable 5.1'],
  ['claude-opus-5-5', 'Opus 5.5'],
  ['claude-sonnet-5-5', 'Sonnet 5.5'],
  ['claude-haiku-4-5-20251001', 'Haiku 4.5'],
];
const THEMES = [['system', 'Match my Mac'], ['light', 'Light'], ['dark', 'Dark']];
const APPROVALS = [
  ['auto', 'Auto: Claude decides what\'s safe', 'Claude Code\'s built-in safety check approves everyday actions on its own and blocks risky ones instead of asking. The fewest approvals.'],
  ['free', 'Free inside the project folder (recommended)', 'Edits files and runs commands without asking, but only inside this folder. Anything that would change the rest of your Mac, or reach an unfamiliar website, still asks you.'],
  ['acceptEdits', 'Auto-approve file edits, ask before commands', 'Edits files in this folder without asking. Every command asks first.'],

// Chrome is switched on or off when a critter starts, so changing it restarts them. Ask first
// rather than quietly cancelling a question they're waiting on, or cutting a step short.
const chromeWait = new Map();  // projectId -> Chrome on/off, once the step in progress finishes
async function setChrome(p, el) {
  const on = el.checked, name = workerOf(p).name, onOff = on ? 'on' : 'off', OnOff = on ? 'On' : 'Off';
  let when = 'now';
  if ([...perms.values()].some(r => r.projectId === p.id)) {
    const v = await choose(`${name} is waiting for your answer.`, `Turning Chrome ${onOff} restarts ${name} and cancels the question.`,
      [['answer', 'Answer First', 'primary'], ['now', `Turn ${OnOff} Anyway`, 'warn']]);
    if (v !== 'now') { el.checked = !on; if (v === 'answer') openDrawer(p.id, 'chat'); return; }
  } else if (busy.has(p.id)) {
    const v = await choose(`${name} is in the middle of something.`,
      `Chrome can turn ${onOff} when ${name} finishes, or right now (which stops the current step; ${name} picks up from the chat).`,
      [['afterTurn', `When ${name} Finishes`, 'primary'], ['now', 'Right Now']]);
    if (!v) { el.checked = !on; return; }
    when = v;
  }
  p.useChrome = on;
  const r = await api('PATCH', `/api/projects/${p.id}`, { useChrome: on, when }).catch(() => null);
  if (!r) return;
  if (r.waitingForTurn) chromeWait.set(p.id, on); else chromeWait.delete(p.id);
  if (r.cancelledRequests?.length) toast(`Chrome is ${onOff}. ${r.cancelledRequests.includes('ExitPlanMode') ? `${name}'s plan comes back in a moment.` : `${name} will ask again in a moment.`}`);
  else if (r.stoppedMidStep) toast(`Chrome is ${onOff}. ${name} picks up from the chat with your next message.`);
  if (drawer.id === p.id && drawer.tab === 'details') renderDrawer(true);
}

function md(s) {
  return String(s).split('```').map((part, i) => {
    if (i % 2) {
      const nl = part.indexOf('\n');
      const code = nl >= 0 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim()) ? part.slice(nl + 1) : part;
      return `<div class="code-box"><pre class="code">${esc(code.replace(/\n$/, ''))}</pre><button type="button" class="copy-code" data-action="copy-code" aria-label="Copy code">Copy</button></div>`;
    }
    const h = esc(part.replace(/^\n+|\n+$/g, ''))
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/^#{1,6} (.+)$/gm, '<b class="h">$1</b>');
    return h ? `<div class="md">${mdTables(h)}</div>` : '';
  }).join('');
}
// Markdown tables (a header row, a |---| row, then body rows) become real tables.
function mdTables(h) {
  const lines = h.split('\n'), out = [];
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const isSep = l => l.includes('|') && /^\s*\|?(\s*:?-+:?\s*\|)*\s*:?-+:?\s*\|?\s*$/.test(l);
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].includes('|') || !isSep(lines[i + 1] || '')) { out.push({ t: lines[i] }); continue; }
    const head = cells(lines[i]);
    const align = cells(lines[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : '');
    const rows = [];
    let j = i + 2;
    while (j < lines.length && lines[j].includes('|') && lines[j].trim()) rows.push(cells(lines[j++]));
    const cell = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${c}</${tag}>`;
    out.push({ table: true, t: `<div class="md-table"><table><thead><tr>${head.map((c, k) => cell('th', c, k)).join('')}</tr></thead><tbody>${
      rows.map(r => `<tr>${head.map((_, k) => cell('td', r[k] ?? '', k)).join('')}</tr>`).join('')}</tbody></table></div>` });
    i = j - 1;
  }
  // No line breaks around a table, and no blank line after one: it's a block of its own, and in pre-wrap text they'd add gaps.
  const kept = out.filter((x, k) => !(k && out[k - 1].table && !x.table && !x.t.trim()));
  return kept.map((x, k) => (k && !x.table && !kept[k - 1].table ? '\n' : '') + x.t).join('');
}
function diffLines(a, b) {
  const A = String(a ?? '').split('\n'), B = String(b ?? '').split('\n');
  if (a === '' || a == null) return B.map(t => ['+', t]);
  const n = A.length, m = B.length;
  if (n * m > 250000) return [...A.map(t => ['-', t]), ...B.map(t => ['+', t])];
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['-', A[i++]]);
    else out.push(['+', B[j++]]);
  }
  while (i < n) out.push(['-', A[i++]]);
  while (j < m) out.push(['+', B[j++]]);
  return out;
}
function diffHTML(lines, maxLines = 400) {
  const out = [];
  let k = 0;
  while (k < lines.length && out.length < maxLines) {
    if (lines[k][0] === ' ') {
      let e = k; while (e < lines.length && lines[e][0] === ' ') e++;
      const run = e - k;
      if (run > 7) {
        const head = k === 0 ? 0 : 3, tail = e === lines.length ? 0 : 3;
        for (let x = k; x < k + head; x++) out.push(lineHTML(lines[x]));
        out.push(`<div class="dl gap"><span class="sign">⋯</span>${run - head - tail} unchanged lines</div>`);
        for (let x = e - tail; x < e; x++) out.push(lineHTML(lines[x]));
      } else for (let x = k; x < e; x++) out.push(lineHTML(lines[x]));
      k = e;
    } else out.push(lineHTML(lines[k++]));
  }
  if (k < lines.length) out.push(`<div class="dl gap"><span class="sign">⋯</span>${lines.length - k} more lines</div>`);
  return `<div class="diff">${out.join('')}</div>`;
}
function lineHTML([s, t]) {
  const cls = s === '+' ? 'add' : s === '-' ? 'del' : s === '@' ? 'hunk' : '';
  return `<div class="dl ${cls}"><span class="sign">${s === '@' ? '' : esc(s)}</span>${esc(t)}</div>`;
}

function limitRow(label, lim) {
  if (!lim || lim.pct == null) return `<div class="limit"><b>${label}</b><span class="muted">No reading yet. Press Check to get one.</span></div>`;
  return `<div class="limit"><b>${label}</b>${meterHTML(lim.pct)}<span class="pct">${lim.pct}%</span><span class="muted">${resetText(lim.resetsAt)}</span></div>`;
}
function usagePanel() {
  if (!usage) return `<section class="panel usage"><h3>Claude usage</h3><p class="muted">Loading…</p></section>`;
  const { plan } = usage;
  const usageOf = id => usage.projects.find(x => x.id === id);
  const addUp = (a, b) => { if (!b) return a; if (!a) return b; const out = { ...a }; for (const k of Object.keys(a)) if (a[k] && typeof a[k] === 'object') out[k] = Object.fromEntries(Object.keys(a[k]).map(f => [f, (a[k][f] || 0) + (b[k]?.[f] || 0)])); return out; };
  const rows = openProjects().map(p => ({ p, u: seatsOf(p).reduce((acc, m) => addUp(acc, usageOf(m.id)), usageOf(p.id)) })).filter(r => r.u);
  const total5 = rows.reduce((a, r) => a + r.u.fiveHour.fresh, 0);
  let acc = 0;
  const slices = rows.filter(r => r.u.fiveHour.fresh > 0).map(r => {
    const pct = total5 ? r.u.fiveHour.fresh / total5 * 100 : 0;
    const from = acc; acc += pct;
    return { r, pct, from, to: acc, color: `var(--plate-${PLATES[r.p.plate] ? r.p.plate : 'moss'})` };
  });
  const pie = slices.length ? `conic-gradient(${slices.map(x => `${x.color} ${x.from.toFixed(2)}% ${x.to.toFixed(2)}%`).join(', ')})` : 'var(--line-soft)';
  const share = r => total5 ? Math.round(r.u.fiveHour.fresh / total5 * 100) : 0;
  return `
  <section class="panel usage">
    <div class="usage-head"><h3>Claude usage</h3>
      <span class="usage-check"><span class="muted">${plan.fiveHour.at ? `Plan reading ${ago(plan.fiveHour.at)}` : ''}</span>
        <button class="btn small" data-action="check-usage" ${usageChecking ? 'disabled' : ''}>${usageChecking ? 'Checking…' : 'Check'}</button></span></div>
    <div class="limits">
      ${limitRow('5-hour window', plan.fiveHour)}
      ${limitRow('This week', plan.week)}
      ${plan.weekOpus ? limitRow('This week (Opus)', plan.weekOpus) : ''}
      ${plan.weekSonnet ? limitRow('This week (Sonnet)', plan.weekSonnet) : ''}
    </div>
    <div class="usage-split">
      <div class="pie" style="background:${pie}" role="img" aria-label="Share of your critters' usage in the last 5 hours"></div>
      <div>
        <h4 class="pie-title">Who used the last 5 hours</h4>
        <ul class="pie-legend">${slices.map(x => { const w = workerOf(x.r.p); return `
          <li><i style="background:${x.color}"></i>${critterImg(w, '', false)}<b>${esc(w.name)}</b><span>${Math.round(x.pct)}%</span></li>`; }).join('') || '<li class="muted">No critter work in the last 5 hours.</li>'}</ul>
      </div>
    </div>
    <table class="usage-table">
      <thead><tr><th scope="col">Critter</th><th scope="col">Share of 5 hours</th><th scope="col">This week</th><th scope="col">This shift</th><th scope="col">All time</th></tr></thead>
      <tbody>${rows.map(({ p, u }) => { const w = workerOf(p); return `
        <tr>
          <th scope="row"><span class="who-cell">${critterImg(w, '', false)}<span><b>${esc(w.name)}</b><small>${esc(p.name)}</small></span></span></th>
          <td><b>${share({ u })}%</b> <small class="muted">· ${fmtTok(u.fiveHour.fresh)}</small></td>
          <td>${fmtTok(u.week.fresh)}</td>
          <td>${fmtTok(u.today.fresh)} <small class="muted">· ${u.today.replies} replies</small></td>
          <td>${fmtTok(u.total.fresh)}</td>
        </tr>`; }).join('')}</tbody>
    </table>
  </section>`;
}

/* ---------- Floor ---------- */
function askingCount(id) { let n = 0; for (const r of perms.values()) if (r.projectId === id) n++; return n; }
function saying(p) {
  if (askingCount(p.id)) return ['May I?', 'warn'];
  if (p.wrapping) return ['packing up…', ''];
  if (p.helpers?.length) return [pickFrom(SAYS.crew, p.id + p.helpers.length), 'team'];
  if (p.inDesktop && !p.desktopDone) return [pickFrom(SAYS.away, p.id + 'away'), 'trip'];
  if (busy.has(p.id)) return [pickFrom(SAYS.busy, p.id + p.day), ''];
  const cls = { needs: 'warn', blocked: 'bad', out: 'off', home: 'off' }[p.status] || '';
  return [pickFrom(SAYS[p.status] || SAYS.out, p.id + p.status + p.day), cls];
}

// How the floor orders cubicles. Remembered in this browser.
// A cubicle counts its desk mates too, so a message to a desk mate moves the whole cubicle up.
const latest = (p, k) => Math.max(p[k] || 0, ...seatsOf(p).map(m => m[k] || 0));
const FLOOR_SORTS = {
  added: ['Order added', () => 0],
  active: ['Last active', (a, b) => latest(b, 'updatedAt') - latest(a, 'updatedAt')],
  messaged: ['Last messaged', (a, b) => latest(b, 'lastMessagedAt') - latest(a, 'lastMessagedAt') || latest(b, 'updatedAt') - latest(a, 'updatedAt')],
  name: ['Name (A to Z)', (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' })],
};
let floorSort = 'added';
try { floorSort = localStorage.getItem('agentOffice.floorSort') || 'added'; } catch (e) {}
if (!FLOOR_SORTS[floorSort]) floorSort = 'added';

function renderFloor() {
  const ps = [...openProjects()].sort(FLOOR_SORTS[floorSort][1]);
  const openTodos = ps.reduce((n, p) => n + p.todos.filter(t => !t.done).length, 0);
  const ideas = ps.reduce((n, p) => n + p.ideas.length, 0);
  const counts = Object.fromEntries(Object.keys(STATUSES).map(k => [k, allOpen().filter(p => p.status === k).length]));
  const closed = closedProjects();
  let legacy = 0;
  try { legacy = office.projects.length ? 0 : (JSON.parse(localStorage.getItem('agentOffice.v1') || '{}').projects || []).length; } catch (e) {}
  const peek = freeWorkers().slice(0, 3);

  return `
    ${legacy ? `<div class="banner"><p>Found ${legacy} cubicle${legacy === 1 ? '' : 's'} from the first version of the office in this browser.</p>
      <button class="btn primary" data-action="import-local">Move Them In</button></div>` : ''}
    <a class="burrow" href="#" data-action="go" data-v="boss">
      <span class="burrow-door" aria-hidden="true">
        <svg viewBox="0 0 64 72" width="64" height="72" fill="none">
          <path d="M8 70V26a24 24 0 0 1 48 0v44z" fill="var(--berry)"></path>
          <path d="M14 70V28a18 18 0 0 1 36 0v42" stroke="var(--berry-bg)" stroke-width="2" opacity=".55"></path>
          <circle cx="32" cy="26" r="7" fill="var(--mustard-bg)" stroke="var(--mustard)" stroke-width="2"></circle>
          <circle cx="45" cy="48" r="3" fill="var(--mustard)"></circle>
          <path d="M2 70h60" stroke="var(--moss)" stroke-width="4" stroke-linecap="round"></path>
        </svg>
      </span>
      <div class="burrow-text"><h2>The Boss's Burrow</h2>
        ${usage?.plan?.fiveHour?.pct != null ? `<p class="burrow-usage">Claude ${meterHTML(usage.plan.fiveHour.pct)} <b>${usage.plan.fiveHour.pct}%</b> of your 5-hour limit${usage.plan.fiveHour.resetsAt ? ` · ${resetText(usage.plan.fiveHour.resetsAt)}` : ''}</p>` : ''}</div>
      <span class="knock"><span class="k1">Knock,</span> <span class="k2">Knock!</span> <span class="arrow">→</span></span>
    </a>
    ${ps.length ? `<div class="floor-bar"><div class="chips">${Object.entries(STATUSES).filter(([k]) => counts[k]).map(([k, s]) =>
      `<span class="chip" style="${statusVars(k)}">${counts[k]} ${s.chip}</span>`).join('')}</div>
      ${ps.length > 1 ? `<label class="floor-sort">Sort by <select class="field" id="floor-sort">${Object.entries(FLOOR_SORTS).map(([k, [label]]) =>
        `<option value="${k}" ${k === floorSort ? 'selected' : ''}>${label}</option>`).join('')}</select></label>` : ''}</div>` : ''}
    <div class="floor">
      ${ps.filter(p => !goneHome(p)).map(cubeHTML).join('')}
      <button class="vacant" data-action="hire">
        <span>${peek.length ? `<span class="peek">${peek.map(w => critterImg(w, '', false)).join('')}</span>` : ''}${freeWorkers().length ? `Hire a critter<br><small class="muted">${freeWorkers().length} waiting in the meadow</small>`
          : `Everyone's at a desk<br><small class="muted">Close a quiet project to free a critter</small>`}</span>
      </button>
    </div>
    ${afterHoursHTML(ps.filter(goneHome))}
    ${closed.length ? `<details class="shelf"><summary>Closed projects (${closed.length})</summary>
      <ul class="closed-list">${closed.map(p => { const w = workerOf(p); return `
        <li>${critterImg(w, '', false)}<div class="what"><b>${esc(p.name)}</b><span>With ${esc(w.name)} · ${p.day - 1} day${p.day - 1 === 1 ? '' : 's'} · closed ${fmtDate(p.closedAt)}</span></div>
          <button class="btn small" data-action="open" data-id="${p.id}" data-t="past">Past Shifts</button>

}

// Cubicles whose critters (and desk mates) have all gone home sit below the garden fence.
// Messaging one wakes it, and it moves back up to the floor while it works.
const goneHome = p => [p, ...seatsOf(p)].every(m => m.status === 'home' && !busy.has(m.id) && !askingCount(m.id));
const andList = xs => xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`;
function afterHoursHTML(ps) {

  return `<section class="after-hours" aria-label="Gone home">

        </svg>

}

function cubeHTML(p) {

        `<button class="dot ${i < p.stage ? 'on' : i === p.stage ? 'now' : ''}" title="Mark as ${st}" aria-label="Mark as ${st}" data-action="stage" data-id="${p.id}" data-i="${i}"></button>`).join('')}<span>${STAGES[p.stage]}</span></div>
      <p class="task">${p.task.trim() ? esc(p.task) : `<em>${p.folder ? 'No task set for today' : 'No project folder yet'}</em>`}</p>
      ${seatsOf(p).length ? `<div class="mates">${seatsOf(p).map(m => { const mw = workerOf(m), ms = STATUSES[m.status] || STATUSES.out, n = askingCount(m.id); return `
        <button class="mate" data-action="open" data-id="${m.id}" title="${esc(mw.name)}: ${esc(m.task || 'desk mate')}">${critterImg(mw, '', false)}<b>${esc(mw.name)}</b>
          <span class="pill" style="${statusVars(m.status)}">${n ? 'May I?' : busy.has(m.id) ? 'Working' : ms.label}</span>${m.unread ? '<i class="mate-dot" aria-label="New reply"></i>' : ''}</button>`; }).join('')}</div>` : ''}

}

// A shift whose chat has grown big: every message re-sends the whole chat, so a fresh shift is cheaper.
const LONG_SHIFT = 150e3;
function longShift(p) {
  const ctx = !p.closed && p.sessionId && usage?.projects.find(x => x.id === p.id)?.context;
  if (!ctx || ctx < LONG_SHIFT) return '';
  return `<span class="pill long-shift" title="This chat is ${fmtTok(ctx)} tokens. Every message re-sends the whole chat, so each one costs more. Start a New Shift at a good stopping point.">Long Shift · ${fmtTok(ctx)}</span>`;
}

// Something the critter left running in the background, like a preview server. Just a note: the critter is free.
function runningChip(p) {
  if (p.closed || !p.running?.length) return '';
  const all = p.running.map(r => r.description).join(' · ');
  const label = p.running.length > 1 ? `${p.running.length} things` : p.running[0].description;
  return `<span class="pill running" title="Running in the background: ${esc(all)}">Running: ${esc(label)}</span>`;
}

function newDayButton(p) {
  return p.wrapping
    ? `<button class="btn small" data-action="new-day-now" data-id="${p.id}" title="Skip the wrap-up and start the new day now">Wrapping Up… Skip</button>`
    : `<button class="btn small" data-action="new-day" data-id="${p.id}" title="Wrap up this shift, then start a fresh chat">New Shift</button>`;
}

const safeFolderName = n => String(n || '').replace(/[\/:]+/g, '-').replace(/\s+/g, ' ').trim().replace(/^\.+/, '');
// Settings → You: the owner's name (it names the "For …" and "From …" folders) and where projects live.
const ownerName = () => String(office.settings?.name || '').replace(/[\/:*?"<>|]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
const forFolder = () => `For ${ownerName() || 'the Boss'}`;
const fromFolder = () => `From ${ownerName() || 'the Boss'}`;
const projectsRoot = () => office.settings?.projectsRoot || '~/Claude/Projects';
const nameHint = () => `Critters call you this and leave files for you in a "${esc(forFolder())}" folder. Files you send go in "${esc(fromFolder())}".`;
function newFolderPreview(name) {
  const n = safeFolderName(name);
  return n ? `${projectsRoot()}/${n}` : 'Type a project name first';
}
// First run: a welcome sheet asks for the owner's name and where projects live.
const needsSetup = () => office.settings && !office.settings.setupDone && (!SHOTTING || SHOT.has('setup'));
function renderSetup(m) {
  if ($('#setup-name')) return;  // already showing: keep what they've typed

  m.innerHTML = `<div class="sheet setup" role="dialog" aria-labelledby="setupTitle">

async function finishSetup() {
  const btn = $('[data-action="setup-go"]');
  if (btn) btn.disabled = true;
  try {
    const r = await api('PUT', '/api/settings', { name: $('#setup-name').value.trim(), projectsRoot: $('#setup-root').value.trim(), createRoot: true, setupDone: true });
    office.settings = r.settings;
    $('#modal').classList.remove('open'); $('#modal').innerHTML = '';
    render();
    startTour();
  } catch { if (btn) btn.disabled = false; }
}

/* ---------- Office version and updates ---------- */
let ver = null;            // what /api/version said, or { loading: true }
let verState = null;       // { busy } while checking or updating, then the result
let awaitingUpdate = false; // after an update: reload once the restarted office reconnects
function loadVersion() {
  if (ver && !ver.loading) return;
  ver = { loading: true };
  api('GET', '/api/version').then(r => { ver = r; }).catch(() => { ver = { failed: true }; }).finally(renderVersion);
}
function renderVersion() { const el = $('#verPanel'); if (el) el.innerHTML = versionHTML(); }

// Put the spotlight on this stop's target and the card beside it, kept on screen.
function placeTour() {
  const el = $('#tour');
  if (!tour || !el) return;
  const s = tour.steps[tour.i], vw = innerWidth, vh = innerHeight, pad = 8, gap = 14;
  let r;
  if (s.at === 'tray') { const tw = Math.min(470, vw - 32); r = { left: vw - 16 - tw, top: vh - 16 - 120, width: tw, height: 120 }; }
  else r = tourTarget(s)?.getBoundingClientRect();
  el.classList.toggle('no-spot', !r);
  const card = el.querySelector('.tour-card'), spot = el.querySelector('.tour-spot');
  const cw = card.offsetWidth, ch = card.offsetHeight;
  if (!r) { card.style.left = (vw - cw) / 2 + 'px'; card.style.top = (vh - ch) / 2 + 'px'; return; }
  const box = { left: Math.max(4, r.left - pad), top: Math.max(4, r.top - pad) };
  box.width = Math.min(vw - 4, r.left + r.width + pad) - box.left;
  box.height = Math.min(vh - 4, r.top + r.height + pad) - box.top;
  Object.assign(spot.style, { left: box.left + 'px', top: box.top + 'px', width: box.width + 'px', height: box.height + 'px' });

  const clampX = x => Math.max(16, Math.min(vw - cw - 16, x)), clampY = y => Math.max(12, Math.min(vh - ch - 12, y));
  const midY = clampY(box.top + box.height / 2 - ch / 2);
  let left = clampX(box.left + box.width / 2 - cw / 2), top;
  if (box.top + box.height + gap + ch <= vh - 12) top = box.top + box.height + gap;
  else if (box.top - gap - ch >= 12) top = box.top - gap - ch;
  else if (box.left + box.width + gap + cw <= vw - 16) { left = box.left + box.width + gap; top = midY; }
  else if (box.left - gap - cw >= 16) { left = box.left - gap - cw; top = midY; }
  else top = 12 + ch - box.top < box.top + box.height - (vh - ch - 12) ? 12 : vh - ch - 12;
  card.style.left = left + 'px'; card.style.top = top + 'px';
}

/* ---------- Drawer ---------- */
function openDrawer(id, tab) {
  const p = find(id);
  if (!p) return;
  tab = tab || (p.closed ? 'past' : 'chat');
  const same = drawer.id === id;
  drawer = { id, tab };
  if (!same) { chat = null; pastChat = null; sessionsList = null; changes = null; }
  if (p.unread && !SHOTTING) patch(p, { unread: false });
  document.body.classList.add('drawer-open');
  renderDrawer(true);
  if ((tab === 'chat' || tab === 'log') && !chat) loadChat(p);
  if (tab === 'changes') loadChanges(p);
  if (tab === 'details') loadFolders();
  render();
  maybeCubeTour();
}
function closeDrawer() {
  drawer = { id: null, tab: 'chat' };
  chat = null; pastChat = null;
  document.body.classList.remove('drawer-open');
  render();
}
function loadFolders() {
  if (folders.length) return;
  api('GET', '/api/folders').then(r => { folders = r.folders; if (drawer.tab === 'details') renderDrawer(true); }).catch(() => {});
}
async function loadChat(p) {
  chat = { id: p.id, items: [], loading: true, buffer: [] };
  renderChatLog();
  if (!p.sessionId) { chat.loading = false; renderChatLog(); return; }
  try {
    const { items } = await api('GET', `/api/chat?session=${encodeURIComponent(p.sessionId)}&dir=${encodeURIComponent(p.folder)}`);
    if (!chat || chat.id !== p.id) return;
    const seen = new Set(items.map(itemKey));
    chat.items = items.concat(chat.buffer.filter(x => !seen.has(itemKey(x))));
  } catch (e) {}
  if (chat) { chat.loading = false; chat.buffer = []; renderChatLog(true); }
}
const itemKey = x => x.kind + ':' + (x.id || x.toolUseId || (x.text || '').slice(0, 200));

const readB64 = blob => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = bad; r.readAsDataURL(blob); });
function loadImg(file) {
  return new Promise((ok, bad) => { const img = new Image(); img.onload = () => ok(img); img.onerror = bad; img.src = URL.createObjectURL(file); });
}
async function preparePhoto(file) {
  const img = await loadImg(file);
  const big = Math.max(img.naturalWidth, img.naturalHeight);
  const easy = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type);
  const asIs = easy && big <= 2000 && file.size <= 3.5e6;  // small enough to send unchanged
  let view, viewType;
  if (asIs) { view = await readB64(file); viewType = file.type; }
  else {
    const k = Math.min(1, VIEW_MAX / big), c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    view = await readB64(blob); viewType = 'image/jpeg';
  }
  // Save the original too when it differs from what the critter sees (bigger, or HEIC from an iPhone).
  const full = !asIs && file.size <= 30e6 && (easy || file.type === 'image/heic') ? await readB64(file) : null;
  return { name: file.name || 'photo', view, viewType, preview: img.src, full, fullType: full ? file.type : viewType };
}
const MAX_FILE = 30e6;
async function prepareFile(file) {
  if (file.size > MAX_FILE) throw new Error(`${file.name} is over 30 MB.`);
  return { kind: 'file', name: file.name || 'file', type: file.type, data: await readB64(file) };
}
async function addPhotos(p, files) {
  files = [...files];
  if (!p || !files.length) return;
  const list = photoDrafts[p.id] ||= [];
  const room = 10 - list.filter(x => !x.loading).length;
  if (room <= 0) return toast('Up to 10 photos or files per message.');
  for (const f of files.slice(0, room)) {
    const slot = { loading: true };
    list.push(slot); renderPhotoTray(p);
    try {
      // Photos get a smaller copy for the critter to look at; a photo the browser can't open (HEIC in Chrome) goes as a file.
      const ready = f.type.startsWith('image/') ? await preparePhoto(f).catch(() => prepareFile(f)) : await prepareFile(f);
      Object.assign(slot, ready, { loading: false });
    }
    catch (e) { list.splice(list.indexOf(slot), 1); toast(e.message?.includes('30 MB') ? e.message : `Couldn't open ${f.name || 'that file'}.`); }
    renderPhotoTray(p);
  }
  if (files.length > room) toast('Up to 10 photos or files per message. Added the first ' + room + '.');
}

// Save a version (commit), publish it (push), and open a pull request, without typing git commands.
function shipBar(p, unsaved) {
  const info = changes?.info, w = workerOf(p);
  if (!info) return '';
  const parts = [];
  if (unsaved) parts.push(`<form class="save-form" data-form="save" data-id="${p.id}">
    <input class="field" placeholder="What changed? (e.g. New contact page)" aria-label="Describe this version" value="${esc(p.task || '')}">
    <button class="btn small accent">Save a Version</button></form>`);
  const line = !info.branch ? 'Not on a branch right now.'
    : !info.remote ? `On branch <code>${esc(info.branch)}</code> · not on GitHub yet.`
    : info.ahead || !info.upstream ? `On branch <code>${esc(info.branch)}</code> · ${info.ahead ? `${info.ahead} saved version${info.ahead === 1 ? '' : 's'} not on GitHub yet` : 'not on GitHub yet'}.`
    : `On branch <code>${esc(info.branch)}</code> · everything saved is on GitHub.`;
  const btns = [];
  if (!info.remote) btns.push(`<button class="btn small" data-action="ask-critter" data-id="${p.id}" data-msg="github">Ask ${esc(w.name)} to Put It on GitHub</button>`);
  if (info.remote && info.branch && (info.ahead || !info.upstream)) btns.push(`<button class="btn small" data-action="publish" data-id="${p.id}">Publish to GitHub</button>`);
  if (info.remote && info.gh && info.branch && info.branch !== info.defaultBranch) btns.push(`<button class="btn small" data-action="pull-request" data-id="${p.id}">Open a Pull Request</button>`);
  return `<div class="ship">${parts.join('')}<div class="ship-line"><span class="muted">${line}</span>${btns.join('')}</div></div>`;
}

/* ---------- Slash commands ---------- */
const commands = {};   // projectId -> list from Claude Code, or 'loading'
let slash = { open: false, items: [], sel: 0 };
async function updateSlash() {
  const box = $('#msg'), menu = $('#slashMenu'), p = find(drawer.id);
  if (!box || !menu || !p) return;
  const m = box.value.match(/^\/([\w:.-]*)$/);
  if (!m) return closeSlash();
  if (!commands[p.id]) {
    commands[p.id] = 'loading';
    api('GET', `/api/projects/${p.id}/commands`).then(r => { commands[p.id] = r.commands; updateSlash(); }).catch(() => { commands[p.id] = []; });
  }
  // /login is the office's own sign-in (a critter's chat can't sign in to Claude).
  const list = Array.isArray(commands[p.id]) ? [SIGNIN_CMD, ...commands[p.id].filter(c => c.name !== 'login')] : commands[p.id];
  const q = m[1].toLowerCase();
  slash.items = Array.isArray(list) ? list.filter(c => c.name.toLowerCase().includes(q)).sort((a, b) => b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)).slice(0, 40) : [];
  slash.sel = Math.min(slash.sel, Math.max(0, slash.items.length - 1));
  slash.open = true;
  menu.hidden = false;
  menu.innerHTML = list === 'loading' ? '<div class="empty">Loading commands…</div>'
    : slash.items.length ? slash.items.map((c, i) => `<button class="${i === slash.sel ? 'on' : ''}" role="option" aria-selected="${i === slash.sel}" data-action="pick-command" data-c="${esc(c.name)}"><b>/${esc(c.name)}${c.hint ? ` ${esc(c.hint)}` : ''}</b><span>${esc(c.description)}</span></button>`).join('')
    : '<div class="empty">No matching commands.</div>';
  menu.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
}
function closeSlash() { slash.open = false; const menu = $('#slashMenu'); if (menu) { menu.hidden = true; menu.innerHTML = ''; } }
const SIGNIN_CMD = { name: 'login', description: 'Sign in to Claude. Opens Terminal on this Mac.', hint: '' };
function pickCommand(name) {
  const box = $('#msg');
  if (name === 'login') { box.value = ''; autosize(box); closeSlash(); signIn.ids.add(drawer.id); return startSignIn(); }
  box.value = `/${name} `; closeSlash(); box.focus(); autosize(box);
}

function changesHTML(p) {
  if (!changes) return '<div class="sys">Loading changes…</div>';
  const refresh = `<button class="btn small" data-action="refresh-changes" data-id="${p.id}">Refresh</button>`;
  const w = workerOf(p);
  if (changes.noFolder) return '<p class="muted">Pick a project folder under Details first.</p>';
  if (changes.notRepo) return `<p>This folder isn't tracked with git, so there's no overall diff to show and no way to save versions or publish.</p>
    <p class="muted">Every edit still shows as a red and green diff inside the chat, and Undo From Here under your messages still works without git.</p>
    <button class="btn small accent" data-action="ask-critter" data-id="${p.id}" data-msg="setup-git">Ask ${esc(w.name)} to Set Up Git</button> ${refresh}`;
  const waiting = p.worktree && changes.waiting?.length ? `<div class="waiting">
    <h4>Saved, not brought back yet</h4>
    <p class="muted">${esc(w.name)} saved ${changes.waiting.length} piece${changes.waiting.length === 1 ? '' : 's'} of work that ${changes.waiting.length === 1 ? "isn't" : "aren't"} in the main project yet:</p>
    <ul>${changes.waiting.slice(0, 12).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    ${changes.waitingFiles?.length ? `<p class="muted">Files: ${changes.waitingFiles.slice(0, 20).map(f => esc(f.split('\t').pop())).join(', ')}</p>` : ''}
    <button class="btn small accent" data-action="bring-back" data-id="${p.id}">Bring Work Back</button></div>` : '';
  const files = (changes.status || '').split('\n').filter(Boolean);
  const ship = shipBar(p, files.length);
  if (!files.length) return `${ship}${waiting}<p>No unsaved changes${waiting ? ' besides that' : ''}. All tidy.</p>${refresh}`;
  const untracked = files.filter(l => l.startsWith('??')).map(l => l.slice(3));
  const sections = [];
  let cur = null;
  for (const line of (changes.diff || '').split('\n')) {
    if (line.startsWith('diff --git')) { cur = { file: line.replace(/^diff --git a\/(.+?) b\/.*$/, '$1'), lines: [] }; sections.push(cur); }
    else if (!cur || /^(index |--- |\+\+\+ |new file|deleted file|similarity|rename |old mode|new mode)/.test(line)) continue;
    else if (line.startsWith('@@')) cur.lines.push(['@', line]);
    else if (line.startsWith('+')) cur.lines.push(['+', line.slice(1)]);
    else if (line.startsWith('-')) cur.lines.push(['-', line.slice(1)]);
    else if (line.startsWith(' ')) cur.lines.push([' ', line.slice(1)]);
  }
  return `${ship}${waiting}<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${files.length} changed file${files.length === 1 ? '' : 's'}</b>${refresh}</div>
    ${sections.map(s => `<div class="file-head"><span class="path">${esc(s.file)}</span></div>${diffHTML(s.lines, 600)}`).join('')}
    ${untracked.length ? `<div class="file-head">New files not yet in git</div><ul class="list">${untracked.map(f => `<li><span class="path">${esc(f)}</span></li>`).join('')}</ul>` : ''}`;
}
